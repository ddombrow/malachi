# Run with: go tool task <name>   (task is pinned in go.mod)
version: '3'

vars:
  BIN: bin/malachi
  # Per-user install location (XDG). Override for a system-wide install:
  #   go tool task install PREFIX=/usr/local   (may need sudo)
  PREFIX: '{{.HOME}}/.local'
  BINDIR: '{{.PREFIX}}/bin'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -X github.com/ddombrow/malachi/coding.Version={{.VERSION}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - '{{.TASK_EXE}} --list'
    silent: true

  build:
    desc: Build bin/malachi, stamped with the git version
    cmds:
      - go build -trimpath -ldflags '{{.LDFLAGS}}' -o {{.BIN}} ./cmd/malachi

  install:
    desc: Install the binary into {{.BINDIR}} (override with PREFIX)
    deps: [build]
    cmds:
      - mkdir -p {{.BINDIR}}
      - install -m 0755 {{.BIN}} {{.BINDIR}}/malachi
      - '{{.BINDIR}}/malachi -version'
      - |
        case ":$PATH:" in
          *":{{.BINDIR}}:"*) ;;
          *) echo "note: {{.BINDIR}} is not in your PATH; add it to run malachi by name" ;;
        esac
    silent: true

  uninstall:
    desc: Remove the installed binary from {{.BINDIR}}
    cmds:
      - rm -f {{.BINDIR}}/malachi
      # Only remove the directory if we emptied it.
      - rmdir {{.BINDIR}} 2>/dev/null || true

  test:
    desc: Run the test suite with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Check formatting and run go vet
    cmds:
      - cmd: test -z "$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)
        silent: true
      - go vet ./...
