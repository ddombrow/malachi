name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The supported platforms; see "Install" in the README.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe stamps the build; it needs history and tags.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The same tasks a contributor runs (task is pinned in go.mod).
      - run: go tool task lint
      # Ubuntu lets an unprivileged process make a user namespace but takes
      # away its capabilities (AppArmor, since 23.10). The pseudo-terminal
      # and loopback settings need them, so their tests would skip here and
      # run nowhere but a developer's machine.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Both runners can sandbox (macOS sandbox-exec; Ubuntu's kernel has
      # Landlock), so the sandbox tests must run there, not skip. With
      # MALACHI_REQUIRE_SANDBOX a test that would skip for want of a sandbox,
      # or of the namespaces above, fails.
      - run: go tool task test
        env:
          MALACHI_REQUIRE_SANDBOX: "1"
      - run: go tool task build
      - run: bin/malachi -version
